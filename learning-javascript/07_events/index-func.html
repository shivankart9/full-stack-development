<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>
<body>
    <h1>Shivankar and Code</h1>
    <button id = "stop">Stop</button>
</body>
<script>
    // setTimeout(function(){
    //     console.log("shivankar")
    // },2000) //does the work after 2 sec but does only one time

    // setInterval(function(){
    //     console.log("tiwari")
    // },2000) // do the work after each two sec

    setTimeout(function() {
        document.querySelector('h1').innerHTML = "Learning JavaScript" 
    },2000)

    const changeText = function() {
        document.querySelector('h1').innerHTML = "Who is Learning Javascript"
    }

    const changeMe = setTimeout(changeText,4000)

    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(changeMe)
        console.log("stop")
    })

</script>
</html>
